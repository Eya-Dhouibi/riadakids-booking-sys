<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Badge hexagon shape -->
  <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" fill="url(#bgGrad)" stroke="#c084fc" stroke-width="2"/>
  <!-- Rocket icon -->
  <g transform="translate(40,38) scale(0.9)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="-8" rx="7" ry="12" fill="white" opacity="0.95"/>
    <!-- Rocket tip -->
    <polygon points="0,-20 -7,-8 7,-8" fill="#e2e8f0"/>
    <!-- Rocket fins -->
    <polygon points="-7,2 -14,10 -7,10" fill="#94a3b8"/>
    <polygon points="7,2 14,10 7,10" fill="#94a3b8"/>
    <!-- Rocket window -->
    <circle cx="0" cy="-8" r="3" fill="#38bdf8" stroke="white" stroke-width="1"/>
    <!-- Flame -->
    <ellipse cx="0" cy="8" rx="4" ry="6" fill="#fb923c" opacity="0.9"/>
    <ellipse cx="0" cy="9" rx="2" ry="4" fill="#fbbf24"/>
  </g>
  <!-- Validated checkmark -->
  <circle cx="60" cy="16" r="11" fill="url(#checkGrad)" stroke="white" stroke-width="2"/>
  <polyline points="54,16 58,20 66,12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stars decorations -->
  <polygon points="15,14 16.2,17.6 20,17.6 17,19.8 18.2,23.4 15,21.2 11.8,23.4 13,19.8 10,17.6 13.8,17.6" fill="#fbbf24" opacity="0.8" transform="scale(0.6) translate(5,5)"/>
</svg>
