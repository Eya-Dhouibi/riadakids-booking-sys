<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" fill="url(#bgGrad)" stroke="#93c5fd" stroke-width="2"/>
  <!-- Clipboard/test icon -->
  <rect x="25" y="22" width="30" height="36" rx="3" fill="white" opacity="0.95"/>
  <rect x="33" y="17" width="14" height="8" rx="2" fill="#93c5fd"/>
  <!-- Lines on clipboard -->
  <line x1="30" y1="34" x2="50" y2="34" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="40" x2="50" y2="40" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="46" x2="42" y2="46" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
  <!-- Checkmark on clipboard -->
  <polyline points="33,42 37,46 47,36" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Validated checkmark -->
  <circle cx="60" cy="16" r="11" fill="url(#checkGrad)" stroke="white" stroke-width="2"/>
  <polyline points="54,16 58,20 66,12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
