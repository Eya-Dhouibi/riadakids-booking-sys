  <circle cx="32" cy="46" r="8" fill="#E6F0FF"/>
  <!-- Face -->
  <circle cx="28" cy="44" r="2" fill="#1a2540"/>
  <circle cx="36" cy="44" r="2" fill="#1a2540"/>
  <path d="M29 49 Q32 52 35 49" stroke="#1a2540" stroke-width="1.5" fill="none"/>
  <!-- Fin -->
  <path d="M14 52 L2 62 L14 56 Z" fill="url(#rocketGrad)"/>
  <path d="M50 52 L62 62 L50 56 Z" fill="url(#rocketGrad)"/>
  <!-- Flame -->
  <ellipse cx="32" cy="72" rx="8" ry="12" fill="url(#flameGrad)" opacity="0.8">
