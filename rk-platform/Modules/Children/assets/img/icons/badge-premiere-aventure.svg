<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" fill="url(#bgGrad)" stroke="#fca5a5" stroke-width="2"/>
  <!-- Mountain/flag icon -->
  <polygon points="40,15 22,58 58,58" fill="white" opacity="0.9"/>
  <polygon points="40,15 32,35 48,35" fill="#fca5a5" opacity="0.7"/>
  <!-- Flag -->
  <rect x="38" y="10" width="2" height="18" fill="white" rx="1"/>
  <polygon points="40,10 54,14 40,18" fill="#fbbf24"/>
  <!-- Validated checkmark -->
  <circle cx="60" cy="16" r="11" fill="url(#checkGrad)" stroke="white" stroke-width="2"/>
  <polyline points="54,16 58,20 66,12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
