<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Lion face -->
  <circle cx="20" cy="22" r="14" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <!-- Mane -->
  <circle cx="20" cy="22" r="18" fill="#d97706" opacity="0.5"/>
  <circle cx="20" cy="22" r="14" fill="#f59e0b"/>
  <!-- Eyes -->
  <circle cx="16" cy="19" r="2.5" fill="white"/>
  <circle cx="24" cy="19" r="2.5" fill="white"/>
  <circle cx="16.5" cy="19.5" r="1.2" fill="#1e293b"/>
  <circle cx="24.5" cy="19.5" r="1.2" fill="#1e293b"/>
  <!-- Nose -->
  <ellipse cx="20" cy="24" rx="2.5" ry="1.5" fill="#d97706"/>
  <!-- Mouth -->
  <path d="M17.5,26 Q20,29 22.5,26" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crown -->
  <polygon points="20,4 16,10 10,8 13,14 27,14 30,8 24,10" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
